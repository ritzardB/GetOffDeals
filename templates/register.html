
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b2b">
  <title>Create Account | GetOffDeals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <header class="nav-wrap">
    <nav class="nav container">
      <a class="brand" href="/">
        <span class="brand-mark">↗</span> GetOffDeals <span class="brand-dot">.</span>
      </a>
      <a class="nav-cta" href="/login">Sign in ↗</a>
    </nav>
  </header>

  <main class="auth-main container">
    <section class="auth-card">
      <span class="auth-eyebrow">YOUR NEXT ADVENTURE STARTS HERE</span>
      <h1>Create your <em>account.</em></h1>
      <p class="auth-intro">Join GetOffDeals to start exploring your next trip.</p>

      <form id="register-form">

        <label for="first-name">First name</label>
        <input id="first-name" name="first_name" type="text"
              autocomplete="given-name" required minlength="1" maxlength="80">

        <label for="last-name">Last name (optional)</label>
        <input id="last-name" name="last_name" type="text"
              autocomplete="family-name" maxlength="80">

        <label for="email">Email address</label>
        <input id="email" name="email" type="email"
               autocomplete="email" required maxlength="254">

        <label for="password">Create password</label>
        <input id="password" name="password" type="password"
               autocomplete="new-password" required minlength="8" maxlength="128">
        <small class="auth-hint">Use at least 8 characters.</small>

        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirm-password" type="password"
               autocomplete="new-password" required minlength="8" maxlength="128">

        <button class="button button-dark auth-submit" type="submit">
          Create account <span>↗</span>
        </button>
        <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-switch">
        Already registered? <a href="/login">Sign in</a>
      </p>
      <a class="auth-home" href="/">← Back to home</a>
    </section>
  </main>

  <script src="{{ url_for('static', filename='auth.js') }}" defer></script>
</body>
</html>
