
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | GetOffDeals</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='auth.js') }}" defer></script>
</head>
<body class="auth-page">
  <header class="nav-wrap">
    <nav class="nav container">
      <a class="brand" href="/">
        <span class="brand-mark">↗</span> GetOffDeals <span class="brand-dot">.</span>
      </a>
      <a class="nav-cta" href="/login">Sign in ↗</a>
    </nav>
  </header>
  <main class="auth-main container">
    <section class="auth-card">
      <p class="auth-eyebrow">GETOFFDEALS</p>
      <h1>Forgot your password?</h1>
      <p class="auth-intro">
        Enter your account email and we'll send you a password recovery link.
      </p>

      <div id="auth-status" class="auth-status" role="status"
           aria-live="polite"></div>

      <form id="forgot-password-form">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          maxlength="254"
          placeholder="you@example.com"
        >
        <button type="submit">Send recovery link</button>
      </form>

      <p class="auth-switch">
        Remembered your password?
        <a href="{{ url_for('login_page') }}">Sign in</a>
      </p>
      <p class="auth-home">
        <a href="{{ url_for('home') }}">Back to GetOffDeals</a>
      </p>
    </section>
  </main>
</body>
</html>
