<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | GetOffDeals</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='auth.js') }}" defer></script>
</head>
<body class="auth-page">
  <header class="nav-wrap">
    <nav class="nav container">
      <a class="brand" href="/">
        <span class="brand-mark">↗</span> GetOffDeals <span class="brand-dot">.</span>
      </a>
      <a class="nav-cta" href="/login">Sign in ↗</a>
    </nav>
  </header>
  <main class="auth-main container">
    <section class="auth-card">
      <p class="auth-eyebrow">GETOFFDEALS</p>
      <h1>Set a new password</h1>
      <p class="auth-intro">
        Choose a new password for your account.
      </p>

      <div id="auth-status" class="auth-status" role="status"
           aria-live="polite"></div>

      <form id="reset-password-form">
        <label for="password">New password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
          placeholder="At least 8 characters"
        >

        <label for="confirm-password">Confirm new password</label>
        <input
          id="confirm-password"
          name="confirm-password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
          placeholder="Enter your password again"
        >

        <button type="submit">Update password</button>
      </form>

      <p class="auth-switch">
        <a href="{{ url_for('login_page') }}">Return to sign in</a>
      </p>
    </section>
  </main>
</body>
</html>
